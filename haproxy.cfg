global
    maxconn 256
    log stdout format raw local0

defaults
    log global
    mode http
    option httplog
    timeout connect 500ms
    timeout client 5000ms
    timeout server 5000ms

frontend main
    bind *:80
    default_backend web_backend

backend web_backend
    balance roundrobin
    server web-1 web:5000 check     # <--- ПОРТ ДОЛЖЕН БЫТЬ 5000!

